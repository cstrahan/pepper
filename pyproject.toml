[project]
name = "salt-pepper"
version = "0.7.8"
description = "A CLI front-end to a running salt-api system"
authors = [
    { name = "Seth House", email = "shouse@saltstack.com" }
]
readme = "README.rst"
requires-python = ">=3.7"
dependencies = [
    "requests[socks]>=2.20.0"
]

[project.scripts]
pepper = "pepper.__main__:main"

[project.optional-dependencies]
kerberos = ["requests-gssapi>=1.1.0"]

[build-system]
requires = ["setuptools>=61", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pepper"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--showlocals --log-file /tmp/pepper-runtests.log --show-capture=no -ra"
testpaths = ["tests"]
norecursedirs = [".git", ".nox"]
usefixtures = ["pepperconfig"]

[tool.flake8]
max-line-length = 119
